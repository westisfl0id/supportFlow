<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | SupportFlow</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
    <div>
        <h1>SupportFlow</h1>
        <p id="currentUser" class="muted"></p>
    </div>
    <button id="logoutButton" class="button secondary" type="button">Выйти</button>
</header>

<main class="page">
    <section id="message" class="message hidden" aria-live="polite"></section>

    <section id="statisticsSection" class="panel">
        <div class="panel-header">
            <div>
                <h2>Статистика</h2>
                <p id="statisticsSubtitle" class="muted"></p>
            </div>
            <button id="reloadStatisticsButton" class="button secondary" type="button">Обновить</button>
        </div>

        <div id="statisticsContainer" class="stats-grid"></div>
    </section>

    <section id="createTicketSection" class="panel hidden">
        <div class="panel-header">
            <h2>Создать тикет</h2>
        </div>

        <form id="createTicketForm" class="grid-form">
            <label>
                Заголовок
                <input id="ticketTitle" type="text" minlength="5" maxlength="150" required>
            </label>

            <label>
                Приоритет
                <select id="ticketPriority" required>
                    <option value="LOW">LOW</option>
                    <option value="MEDIUM" selected>MEDIUM</option>
                    <option value="HIGH">HIGH</option>
                    <option value="CRITICAL">CRITICAL</option>
                </select>
            </label>

            <label>
                Категория
                <select id="ticketCategory" required>
                    <option value="SOFTWARE">ПО</option>
                    <option value="HARDWARE">Оборудование</option>
                    <option value="NETWORK">Сеть</option>
                    <option value="ACCESS">Доступ</option>
                    <option value="ACCOUNT">Аккаунт</option>
                    <option value="OTHER" selected>Другое</option>
                </select>
            </label>

            <label class="span-2">
                Описание
                <textarea id="ticketDescription" rows="4" minlength="10" maxlength="3000" required></textarea>
            </label>

            <div class="span-2 file-field">
                <span class="field-label">Вложение</span>

                <input id="ticketAttachment" class="file-input-hidden" type="file" accept=".pdf,.png,.jpg,.jpeg,.txt,.log" multiple hidden>

                <label class="file-upload-card" for="ticketAttachment">
                    <span class="file-upload-icon">📎</span>

                    <span class="file-upload-content">
                        <strong>Выбрать файлы</strong>
                        <small>PDF, PNG, JPG, TXT, LOG до 10 MB</small>
                    </span>
                </label>

                <p id="ticketAttachmentText" class="file-upload-hint">Файлы не выбраны</p>
            </div>

            <button class="button primary" type="submit">Создать</button>
        </form>
    </section>

    <section class="panel">
        <div class="panel-header">
            <div>
                <h2 id="ticketsTitle">Тикеты</h2>
                <p id="ticketsSubtitle" class="muted"></p>
            </div>
            <div class="actions-row">
                <button id="reloadTicketsButton" class="button secondary" type="button">Обновить</button>
                <button id="slaBreachedButton" class="button danger hidden" type="button">SLA breached</button>
            </div>
        </div>

        <form id="ticketFilters" class="filters hidden">
            <select id="filterStatus">
                <option value="">Все статусы</option>
                <option value="NEW">NEW</option>
                <option value="OPEN">OPEN</option>
                <option value="IN_PROGRESS">IN_PROGRESS</option>
                <option value="WAITING">WAITING</option>
                <option value="RESOLVED">RESOLVED</option>
                <option value="CLOSED">CLOSED</option>
            </select>

            <select id="filterPriority">
                <option value="">Все приоритеты</option>
                <option value="LOW">LOW</option>
                <option value="MEDIUM">MEDIUM</option>
                <option value="HIGH">HIGH</option>
                <option value="CRITICAL">CRITICAL</option>
            </select>


            <select id="filterCategory">
                <option value="">Все категории</option>
                <option value="SOFTWARE">ПО</option>
                <option value="HARDWARE">Оборудование</option>
                <option value="NETWORK">Сеть</option>
                <option value="ACCESS">Доступ</option>
                <option value="ACCOUNT">Аккаунт</option>
                <option value="OTHER">Другое</option>
            </select>

            <input id="filterCreatedById" type="number" min="1" placeholder="createdById">
            <input id="filterAssignedToId" type="number" min="1" placeholder="assignedToId">

            <button class="button secondary" type="submit">Фильтр</button>
            <button id="clearFiltersButton" class="button ghost" type="button">Сбросить</button>
        </form>

        <div id="ticketsContainer" class="cards-list"></div>

        <div class="pagination-row">
            <button id="prevTicketsPageButton" class="button secondary small" type="button">Назад</button>

            <span id="ticketPageInfo">Страница 1 из 1</span>

            <button id="nextTicketsPageButton" class="button secondary small" type="button">Вперёд</button>

            <select id="ticketPageSize" class="inline-select">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="20">20</option>
            </select>
        </div>
    </section>

    <section id="usersSection" class="panel hidden">
        <div class="panel-header">
            <div>
                <h2>Пользователи</h2>
                <p class="muted">Доступно только ADMIN</p>
            </div>
            <button id="reloadUsersButton" class="button secondary" type="button">Обновить</button>
        </div>
        <div id="usersContainer" class="table-wrap"></div>
    </section>
</main>

<script type="module" src="js/dashboard.js"></script>
</body>
</html>
